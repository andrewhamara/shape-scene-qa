[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nanoagent-shape-scene-qa"
version = "0.1.0"
description = "Answer questions about pictures of shapes, checked against the scenes' true objects: a NanoAgent plugin"
requires-python = ">=3.12"
dependencies = ["mcp>=1.27,<2", "slimconfig", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
slimconfig = { git = "https://github.com/zeyuyang8/slimconfig", branch = "master" }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
# tests/ import contract.py and the verifier package from the plugin root.
pythonpath = ["."]
